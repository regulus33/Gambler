<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <!-- Gambler iOS app icon ("Odds"). Full-bleed square: iOS applies the rounded mask itself.
       Render into packaging/ios/Images.xcassets with scripts/render-icons.sh -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262626"/>
      <stop offset="1" stop-color="#161616"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#FFD700" stop-opacity=".45"/>
      <stop offset="1" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
  <rect x="16" y="16" width="68" height="68" rx="14" fill="none" stroke="#FF6B6B" stroke-width="5"/>
  <g stroke="#FF6B6B" stroke-opacity=".45" stroke-width="3.5" stroke-linecap="round">
    <line x1="32" y1="72" x2="32" y2="40"/>
    <line x1="44" y1="72" x2="44" y2="60"/>
    <line x1="56" y1="72" x2="56" y2="30"/>
    <line x1="68" y1="72" x2="68" y2="52"/>
  </g>
  <circle cx="56" cy="30" r="11" fill="url(#glow)"/>
  <circle cx="32" cy="40" r="5.5" fill="#FF6B6B"/>
  <circle cx="44" cy="60" r="5.5" fill="#FF6B6B"/>
  <circle cx="56" cy="30" r="5.5" fill="#FFD700"/>
  <circle cx="68" cy="52" r="5.5" fill="#FF6B6B"/>
</svg>
