<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Gambler macOS app icon: the iOS design inside the macOS rounded-square grid (824px tile, drop shadow).
       Render to packaging/icon.png with scripts/render-icons.sh -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262626"/>
      <stop offset="1" stop-color="#161616"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#FFD700" stop-opacity=".45"/>
      <stop offset="1" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <g clip-path="url(#tile)">
    <g transform="translate(100 100) scale(8.24)">
      <rect x="16" y="16" width="68" height="68" rx="14" fill="none" stroke="#FF6B6B" stroke-width="5"/>
      <g stroke="#FF6B6B" stroke-opacity=".45" stroke-width="3.5" stroke-linecap="round">
        <line x1="32" y1="72" x2="32" y2="40"/>
        <line x1="44" y1="72" x2="44" y2="60"/>
        <line x1="56" y1="72" x2="56" y2="30"/>
        <line x1="68" y1="72" x2="68" y2="52"/>
      </g>
      <circle cx="56" cy="30" r="11" fill="url(#glow)"/>
      <circle cx="32" cy="40" r="5.5" fill="#FF6B6B"/>
      <circle cx="44" cy="60" r="5.5" fill="#FF6B6B"/>
      <circle cx="56" cy="30" r="5.5" fill="#FFD700"/>
      <circle cx="68" cy="52" r="5.5" fill="#FF6B6B"/>
    </g>
  </g>
</svg>
